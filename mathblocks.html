<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Silicon Arcade // Math Blocks</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="haptics.js"></script>
  <style>
    body { font-family: 'Fira Code', monospace; touch-action: manipulation; }
    canvas { box-shadow: 0 0 25px rgba(245, 158, 11, 0.25); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

  <!-- Top Header -->
  <header class="max-w-md w-full flex justify-between items-center border-b border-zinc-800 pb-4">
    <a href="/" class="text-xs text-zinc-400 hover:text-amber-400 transition-colors flex items-center gap-1">
      &larr; [RETURN_TO_HUB]
    </a>
    <div class="text-xs text-amber-400 font-bold">SYSTEM // MATH_BLOCKS_v1.0</div>
  </header>

  <!-- Game Stage & HUD -->
  <main class="flex flex-col items-center my-4 w-full max-w-md">
    <div class="flex justify-between w-full bg-zinc-900 border border-zinc-800 p-3 rounded-t-lg text-xs">
      <div>
        <span class="text-zinc-500">TARGET SUM:</span>
        <span id="targetSum" class="text-amber-400 font-bold text-base ml-1">10</span>
      </div>
      <div>
        <span class="text-zinc-500">SCORE:</span>
        <span id="currentScore" class="text-emerald-400 font-bold text-base ml-1">0</span>
      </div>
      <div>
        <span class="text-zinc-500">TIMER:</span>
        <span id="gameTimer" class="text-sky-400 font-bold text-base ml-1">60s</span>
      </div>
    </div>

    <!-- Active Selection Tray -->
    <div class="w-full bg-zinc-900/60 border-x border-zinc-800 px-3 py-1.5 flex justify-between text-xs text-zinc-400">
      <span>SELECTED SUM: <span id="currentSum" class="text-white font-semibold">0</span></span>
      <span class="text-[10px] text-zinc-500">[Click/Tap blocks to reach target]</span>
    </div>

    <canvas id="mathCanvas" width="360" height="480" class="bg-zinc-900 border border-zinc-800 rounded-b-lg touch-none"></canvas>
  </main>

  <footer class="text-xs text-zinc-600 text-center pb-2">
    Silicon Arcade • Clear matching arithmetic nodes before overflow
  </footer>

  <script>
    const canvas = document.getElementById('mathCanvas');
    const ctx = canvas.getContext('2d');
    const targetSumEl = document.getElementById('targetSum');
    const scoreEl = document.getElementById('currentScore');
    const timerEl = document.getElementById('gameTimer');
    const currentSumEl = document.getElementById('currentSum');

    // Synthesized 8-Bit Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'square', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Grid configuration
    const COLS = 6;
    const ROWS = 8;
    const TILE_SIZE = canvas.width / COLS;

    let grid = [];
    let selectedBlocks = [];
    let targetSum = 10;
    let score = 0;
    let timeLeft = 60;
    let gameOver = false;
    let timerInterval = null;

    function randomVal() {
      return Math.floor(Math.random() * 8) + 1; // Numbers 1 through 8
    }

    function initGrid() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          grid[r][c] = {
            val: r >= 2 ? randomVal() : null, // Bottom 6 rows populated
            selected: false,
            animY: 0
          };
        }
      }
    }

    function resetTarget() {
      targetSum = Math.floor(Math.random() * 11) + 10; // Target between 10 and 20
      targetSumEl.textContent = targetSum;
    }

    function getSelectedSum() {
      return selectedBlocks.reduce((acc, b) => acc + grid[b.r][b.c].val, 0);
    }

    function checkMatch() {
      const sum = getSelectedSum();
      currentSumEl.textContent = sum;

      if (sum === targetSum) {
        // Success
        score += selectedBlocks.length * 10;
        scoreEl.textContent = score;
        playBeep(650, 'sine', 0.15);
        if (typeof triggerHaptic === 'function') triggerHaptic('LIGHT');

        // Clear blocks
        selectedBlocks.forEach(b => {
          grid[b.r][b.c] = { val: null, selected: false };
        });
        selectedBlocks = [];
        currentSumEl.textContent = 0;

        applyGravity();
        resetTarget();
      } else if (sum > targetSum) {
        // Exceeded
        playBeep(180, 'sawtooth', 0.2);
        if (typeof triggerHaptic === 'function') triggerHaptic('HEAVY');
        selectedBlocks.forEach(b => {
          grid[b.r][b.c].selected = false;
        });
        selectedBlocks = [];
        currentSumEl.textContent = 0;
      }
    }

    function applyGravity() {
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r > 0; r--) {
          if (grid[r][c].val === null) {
            for (let k = r - 1; k >= 0; k--) {
              if (grid[k][c].val !== null) {
                grid[r][c].val = grid[k][c].val;
                grid[k][c].val = null;
                break;
              }
            }
          }
        }
      }
    }

    function addRowAtBottom() {
      // Shift up
      for (let c = 0; c < COLS; c++) {
        if (grid[0][c].val !== null) {
          gameOver = true;
          return;
        }
      }
      for (let r = 0; r < ROWS - 1; r++) {
        for (let c = 0; c < COLS; c++) {
          grid[r][c].val = grid[r + 1][c].val;
        }
      }
      for (let c = 0; c < COLS; c++) {
        grid[ROWS - 1][c] = { val: randomVal(), selected: false };
      }
    }

    // Input handlers
    canvas.addEventListener('pointerdown', (e) => {
      if (gameOver) {
        restartGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      const c = Math.floor(x / TILE_SIZE);
      const r = Math.floor(y / TILE_SIZE);

      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c].val !== null) {
        const idx = selectedBlocks.findIndex(b => b.r === r && b.c === c);
        if (idx !== -1) {
          grid[r][c].selected = false;
          selectedBlocks.splice(idx, 1);
        } else {
          grid[r][c].selected = true;
          selectedBlocks.push({ r, c });
          playBeep(440, 'triangle', 0.05);
        }
        checkMatch();
      }
    });

    function draw() {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const block = grid[r][c];
          if (block && block.val !== null) {
            const x = c * TILE_SIZE;
            const y = r * TILE_SIZE;

            ctx.fillStyle = block.selected ? '#f59e0b' : '#18181b';
            ctx.strokeStyle = block.selected ? '#fbbf24' : '#27272a';
            ctx.lineWidth = 2;

            ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

            ctx.fillStyle = block.selected ? '#09090b' : '#38bdf8';
            ctx.font = 'bold 20px "Fira Code", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(block.val, x + TILE_SIZE / 2, y + TILE_SIZE / 2);
          }
        }
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 24px "Fira Code", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('STAGE COMPLETED', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#f4f4f5';
        ctx.font = '16px "Fira Code", monospace';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

        ctx.fillStyle = '#a1a1aa';
        ctx.font = '13px "Fira Code", monospace';
        ctx.fillText('Tap anywhere to play again', canvas.width / 2, canvas.height / 2 + 45);
      }

      requestAnimationFrame(draw);
    }

    function restartGame() {
      score = 0;
      timeLeft = 60;
      gameOver = false;
      scoreEl.textContent = '0';
      timerEl.textContent = '60s';
      currentSumEl.textContent = '0';
      selectedBlocks = [];
      initGrid();
      resetTarget();
      startTimers();
    }

    function startTimers() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameOver) {
          timeLeft--;
          timerEl.textContent = `${timeLeft}s`;
          if (timeLeft % 12 === 0) addRowAtBottom();
          if (timeLeft <= 0) {
            gameOver = true;
            clearInterval(timerInterval);
          }
        }
      }, 1000);
    }

    initGrid();
    resetTarget();
    startTimers();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
