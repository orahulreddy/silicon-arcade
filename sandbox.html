<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Arcade // Neural Particle Sandbox</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #09090b;
      --bg-surface: rgba(24, 24, 27, 0.7);
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --accent: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.25);
    }
    [data-theme="amber-crt"] {
      --bg-page: #0c0a09;
      --bg-surface: rgba(28, 25, 23, 0.75);
      --border-color: #44403c;
      --text-main: #fef3c7;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.3);
    }
    [data-theme="synthwave"] {
      --bg-page: #0f0b1e;
      --bg-surface: rgba(30, 21, 56, 0.7);
      --border-color: #4c1d95;
      --text-main: #fdf4ff;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.3);
    }
    [data-theme="matrix"] {
      --bg-page: #020c04;
      --bg-surface: rgba(5, 26, 11, 0.75);
      --border-color: #14532d;
      --text-main: #bbf7d0;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.3);
    }

    body {
      font-family: 'Fira Code', monospace;
      background-color: var(--bg-page) !important;
      color: var(--text-main) !important;
    }
    .theme-panel {
      background-color: var(--bg-surface);
      border-color: var(--border-color);
    }
    .theme-accent { color: var(--accent); }
    .theme-border { border-color: var(--border-color); }
    canvas { box-shadow: 0 0 25px var(--accent-glow); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none transition-colors duration-300">

  <!-- Header -->
  <header class="max-w-4xl w-full flex justify-between items-center border-b theme-border pb-4">
    <a href="/" class="text-xs text-zinc-400 hover:text-purple-400 transition-colors flex items-center gap-1">
      &larr; [RETURN_TO_HUB]
    </a>
    <div class="text-xs theme-accent font-bold">THE_MACHINE // NEURAL_MATRIX_v1.1</div>
  </header>

  <!-- Interactive Controls Toolbar -->
  <div class="max-w-4xl w-full flex flex-wrap items-center justify-between gap-3 my-4 border p-3 rounded-lg text-xs theme-panel">
    <div class="flex items-center gap-2">
      <span class="text-zinc-400">Theme:</span>
      <button onclick="setTheme('default', '#c084fc', '#f472b6')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-purple-300 rounded border border-zinc-700">Purple</button>
      <button onclick="setTheme('matrix', '#34d399', '#10b981')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-emerald-300 rounded border border-zinc-700">Matrix</button>
      <button onclick="setTheme('amber-crt', '#f59e0b', '#d97706')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-amber-300 rounded border border-zinc-700">Amber CRT</button>
      <button onclick="setTheme('synthwave', '#f43f5e', '#38bdf8')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-rose-300 rounded border border-zinc-700">Synthwave</button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-zinc-400">Interaction:</span>
      <button id="modeBtn" onclick="toggleMode()" class="px-2.5 py-1 bg-zinc-800 border border-zinc-600 rounded font-semibold text-zinc-200">
        Mode: Attract
      </button>
      <button onclick="init()" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded border border-zinc-700">
        Reset
      </button>
    </div>
  </div>

  <!-- Canvas Sandbox -->
  <main class="w-full max-w-4xl flex flex-col items-center">
    <canvas id="matrixCanvas" width="900" height="520" class="border rounded-lg max-w-full touch-none cursor-crosshair theme-panel"></canvas>
  </main>

  <footer class="text-xs text-zinc-500 text-center pt-4">
    Move cursor or touch canvas to distort neural field • Silicon Arcade
  </footer>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    const modeBtn = document.getElementById('modeBtn');

    let particleCount = 110;
    let particles = [];
    let interactionMode = 'attract';
    let palette = { primary: '#c084fc', secondary: '#f472b6' };

    const mouse = { x: null, y: null, radius: 140 };

    function setTheme(themeId, primary, secondary) {
      const root = document.documentElement;
      if (themeId === 'default') root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', themeId);
      
      localStorage.setItem('silicon_theme', themeId);
      palette = { primary, secondary };
      particles.forEach(p => p.color = Math.random() > 0.5 ? palette.primary : palette.secondary);
    }

    function toggleMode() {
      interactionMode = interactionMode === 'attract' ? 'repel' : 'attract';
      modeBtn.textContent = `Mode: ${interactionMode.charAt(0).toUpperCase() + interactionMode.slice(1)}`;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.6;
        this.vy = (Math.random() - 0.5) * 1.6;
        this.radius = Math.random() * 2.2 + 1.2;
        this.color = Math.random() > 0.5 ? palette.primary : palette.secondary;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
        if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            const angle = Math.atan2(dy, dx);
            const moveX = Math.cos(angle) * force * 4;
            const moveY = Math.sin(angle) * force * 4;
            if (interactionMode === 'attract') {
              this.x += moveX;
              this.y += moveY;
            } else {
              this.x -= moveX;
              this.y -= moveY;
            }
          }
        }
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      particles = [];
      for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    }

    function connect() {
      const maxDistance = 110;
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDistance) {
            const opacity = 1 - (dist / maxDistance);
            ctx.strokeStyle = palette.primary + Math.floor(opacity * 90).toString(16).padStart(2, '0');
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function updateCoordinates(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (clientX - rect.left) * (canvas.width / rect.width);
      mouse.y = (clientY - rect.top) * (canvas.height / rect.height);
    }

    canvas.addEventListener('mousemove', (e) => updateCoordinates(e.clientX, e.clientY));
    canvas.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updateCoordinates(e.touches[0].clientX, e.touches[0].clientY);
    });
    canvas.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

    function animate() {
      ctx.fillStyle = 'rgba(9, 9, 11, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      connect();
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    // Initialize persisted theme
    (function initLocalTheme() {
      const saved = localStorage.getItem('silicon_theme') || 'default';
      const palettes = {
        'default': ['#c084fc', '#f472b6'],
        'matrix': ['#34d399', '#10b981'],
        'amber-crt': ['#f59e0b', '#d97706'],
        'synthwave': ['#f43f5e', '#38bdf8']
      };
      const colors = palettes[saved] || palettes['default'];
      setTheme(saved, colors[0], colors[1]);
    })();

    init();
    animate();
  </script>
</body>
</html>
