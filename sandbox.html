<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Arcade // Neural Particle Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fira Code', monospace; }
    canvas {
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

  <!-- Header -->
  <header class="max-w-4xl w-full flex justify-between items-center border-b border-zinc-800 pb-4">
    <a href="/" class="text-xs text-zinc-400 hover:text-purple-400 transition-colors flex items-center gap-1">
      &larr; [RETURN_TO_HUB]
    </a>
    <div class="text-xs text-purple-400 font-bold">THE_MACHINE // NEURAL_MATRIX_v1.0</div>
  </header>

  <!-- Interactive Controls Toolbar -->
  <div class="max-w-4xl w-full flex flex-wrap items-center justify-between gap-3 my-4 bg-zinc-900/80 border border-zinc-800 p-3 rounded-lg text-xs">
    <div class="flex items-center gap-2">
      <span class="text-zinc-400">Theme:</span>
      <button onclick="setColorScheme('cyberpunk')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-purple-300 rounded border border-purple-500/30">Neon Purple</button>
      <button onclick="setColorScheme('matrix')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-emerald-300 rounded border border-emerald-500/30">Matrix Green</button>
      <button onclick="setColorScheme('plasma')" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-sky-300 rounded border border-sky-500/30">Cyan Plasma</button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-zinc-400">Interaction:</span>
      <button id="modeBtn" onclick="toggleMode()" class="px-2.5 py-1 bg-purple-950/60 border border-purple-500/50 text-purple-300 rounded font-semibold">
        Mode: Attract
      </button>
      <button onclick="resetParticles()" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded border border-zinc-700">
        Reset
      </button>
    </div>
  </div>

  <!-- Canvas Sandbox -->
  <main class="w-full max-w-4xl flex flex-col items-center">
    <canvas id="matrixCanvas" width="900" height="520" class="bg-zinc-900/90 border border-zinc-800 rounded-lg max-w-full touch-none cursor-crosshair"></canvas>
  </main>

  <!-- Footer -->
  <footer class="text-xs text-zinc-600 text-center pt-4">
    Move cursor or touch canvas to distort neural field • Silicon Arcade
  </footer>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    const modeBtn = document.getElementById('modeBtn');

    let particleCount = 110;
    let particles = [];
    let interactionMode = 'attract'; // 'attract' or 'repel'
    let theme = {
      primary: '#c084fc',
      secondary: '#818cf8',
      line: 'rgba(192, 132, 252, '
    };

    const mouse = {
      x: null,
      y: null,
      radius: 140
    };

    function setColorScheme(type) {
      if (type === 'cyberpunk') {
        theme = { primary: '#c084fc', secondary: '#f472b6', line: 'rgba(192, 132, 252, ' };
      } else if (type === 'matrix') {
        theme = { primary: '#34d399', secondary: '#10b981', line: 'rgba(52, 211, 153, ' };
      } else if (type === 'plasma') {
        theme = { primary: '#38bdf8', secondary: '#818cf8', line: 'rgba(56, 189, 248, ' };
      }
      particles.forEach(p => p.color = Math.random() > 0.5 ? theme.primary : theme.secondary);
    }

    function toggleMode() {
      if (interactionMode === 'attract') {
        interactionMode = 'repel';
        modeBtn.textContent = 'Mode: Repel';
      } else {
        interactionMode = 'attract';
        modeBtn.textContent = 'Mode: Attract';
      }
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 1.6;
        this.vy = (Math.random() - 0.5) * 1.6;
        this.radius = Math.random() * 2.5 + 1.5;
        this.color = Math.random() > 0.5 ? theme.primary : theme.secondary;
      }

      update() {
        // Move
        this.x += this.vx;
        this.y += this.vy;

        // Bounce on edges
        if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
        if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;

        // Mouse gravity physics
        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            const angle = Math.atan2(dy, dx);
            const moveX = Math.cos(angle) * force * 4;
            const moveY = Math.sin(angle) * force * 4;

            if (interactionMode === 'attract') {
              this.x += moveX;
              this.y += moveY;
            } else {
              this.x -= moveX;
              this.y -= moveY;
            }
          }
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function init() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function resetParticles() {
      init();
    }

    function connect() {
      const maxDistance = 110;
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDistance) {
            const opacity = 1 - (dist / maxDistance);
            ctx.strokeStyle = theme.line + (opacity * 0.4) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    // Input handlers
    function updateCoordinates(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      mouse.x = (clientX - rect.left) * scaleX;
      mouse.y = (clientY - rect.top) * scaleY;
    }

    canvas.addEventListener('mousemove', (e) => updateCoordinates(e.clientX, e.clientY));
    canvas.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updateCoordinates(e.touches[0].clientX, e.touches[0].clientY);
    });
    canvas.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

    function animate() {
      ctx.fillStyle = 'rgba(9, 9, 11, 0.28)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      connect();
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>
</body>
</html>
