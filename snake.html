<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Arcade // Neon Snake</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fira Code', monospace; }
    canvas {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

  <!-- Header -->
  <header class="max-w-3xl w-full flex justify-between items-center border-b border-zinc-800 pb-4">
    <a href="/" class="text-xs text-zinc-400 hover:text-sky-400 transition-colors flex items-center gap-1">
      &larr; [RETURN_TO_HUB]
    </a>
    <div class="text-xs text-sky-400 font-bold">SYSTEM // CYBER_SNAKE_v1.0</div>
  </header>
<script src="haptics.js"></script>
  <!-- Game Stage -->
  <main class="flex flex-col items-center my-6">
    <div class="flex justify-between w-full max-w-[500px] mb-3 text-sm px-2">
      <span class="text-sky-400 font-semibold">SCORE: <span id="currentScore">0</span></span>
      <span class="text-xs text-zinc-500">[Arrow Keys / WASD / Swipe]</span>
      <span class="text-emerald-400 font-semibold">BEST: <span id="bestScore">0</span></span>
    </div>

    <canvas id="snakeCanvas" width="500" height="500" class="bg-zinc-900 border border-zinc-700 rounded-lg max-w-full touch-none"></canvas>

    <!-- On-Screen Controls for Mobile -->
    <div class="grid grid-cols-3 gap-2 mt-4 md:hidden w-48 text-center text-xs">
      <div></div>
      <button onclick="changeDirection('UP')" class="p-3 bg-zinc-800 border border-zinc-700 rounded active:bg-zinc-700 font-bold">▲</button>
      <div></div>
      <button onclick="changeDirection('LEFT')" class="p-3 bg-zinc-800 border border-zinc-700 rounded active:bg-zinc-700 font-bold">◀</button>
      <button onclick="changeDirection('DOWN')" class="p-3 bg-zinc-800 border border-zinc-700 rounded active:bg-zinc-700 font-bold">▼</button>
      <button onclick="changeDirection('RIGHT')" class="p-3 bg-zinc-800 border border-zinc-700 rounded active:bg-zinc-700 font-bold">▶</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-xs text-zinc-600 text-center pb-2">
    Silicon Arcade • Consume data nodes to expand memory
  </footer>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('currentScore');
    const bestEl = document.getElementById('bestScore');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let score = 0;
    let highScore = localStorage.getItem('silicon_snake_best') || 0;
    bestEl.textContent = highScore;

    let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
    let velocity = { x: 0, y: -1 };
    let nextVelocity = { x: 0, y: -1 };
    let food = { x: 5, y: 5 };
    let gameOver = false;
    let gameInterval = null;
    let particles = [];

    // Synthesized Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'square', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      // Ensure food doesn't spawn on snake body
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) spawnFood();
      }
    }

    function changeDirection(dir) {
      if (dir === 'UP' && velocity.y === 0) nextVelocity = { x: 0, y: -1 };
      if (dir === 'DOWN' && velocity.y === 0) nextVelocity = { x: 0, y: 1 };
      if (dir === 'LEFT' && velocity.x === 0) nextVelocity = { x: -1, y: 0 };
      if (dir === 'RIGHT' && velocity.x === 0) nextVelocity = { x: 1, y: 0 };
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) changeDirection('UP');
      if (['ArrowDown', 'KeyS'].includes(e.code)) changeDirection('DOWN');
      if (['ArrowLeft', 'KeyA'].includes(e.code)) changeDirection('LEFT');
      if (['ArrowRight', 'KeyD'].includes(e.code)) changeDirection('RIGHT');
      if (e.code === 'Space' && gameOver) resetGame();
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    });

    // Touch Swipe Detection
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) changeDirection('RIGHT');
        else if (dx < -30) changeDirection('LEFT');
      } else {
        if (dy > 30) changeDirection('DOWN');
        else if (dy < -30) changeDirection('UP');
      }
    });

    function createFoodBurst(x, y) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: x * gridSize + gridSize / 2,
          y: y * gridSize + gridSize / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          alpha: 1,
          color: '#f43f5e'
        });
      }
    }

    function update() {
      if (gameOver) return;

      velocity = nextVelocity;
      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall collision wraps around
      if (head.x < 0) head.x = tileCount - 1;
      if (head.x >= tileCount) head.x = 0;
      if (head.y < 0) head.y = tileCount - 1;
      if (head.y >= tileCount) head.y = 0;

      // Self collision
      for (let segment of snake) {
        if (segment.x === head.x && segment.y === head.y) {
          gameOver = true;
          playBeep(140, 'sawtooth', 0.3);
          triggerHaptic('HEAVY');
          return;
        }
      }

      snake.unshift(head);

      // Eat Food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          bestEl.textContent = highScore;
          localStorage.setItem('silicon_snake_best', highScore);
        }
        createFoodBurst(food.x, food.y);
        playBeep(660, 'sine', 0.1);
        triggerHaptic('LIGHT');
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle Grid lines
      ctx.strokeStyle = '#18181b';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw Food (Pulsing Red Neon)
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 12;
      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

      // Draw Snake (Cyan with Head glow)
      snake.forEach((segment, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
        } else {
          ctx.fillStyle = '#0284c7';
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 6;
        }
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });

      // Draw Particles
      particles.forEach((p, idx) => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.05;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      ctx.shadowBlur = 0;

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 24px "Fira Code", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('MEMORY CORRUPTED // GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

        ctx.fillStyle = '#a1a1aa';
        ctx.font = '13px "Fira Code", monospace';
        ctx.fillText('Click anywhere or press Space to reboot', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
      velocity = { x: 0, y: -1 };
      nextVelocity = { x: 0, y: -1 };
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      spawnFood();
    }

    canvas.addEventListener('click', () => { if (gameOver) resetGame(); });

    function gameLoop() {
      update();
      draw();
    }

    spawnFood();
    setInterval(gameLoop, 90);
  </script>
</body>
</html>
