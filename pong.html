<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silicon Arcade // Neon Pong</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fira Code', monospace; }
    canvas {
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.2);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

  <!-- Header & Back Button -->
  <header class="max-w-3xl w-full flex justify-between items-center border-b border-zinc-800 pb-4">
    <a href="/" class="text-xs text-zinc-400 hover:text-emerald-400 transition-colors flex items-center gap-1">
      &larr; [RETURN_TO_HUB]
    </a>
    <div class="text-xs text-emerald-400 font-bold">SYSTEM // NEON_PONG_v1.0</div>
  </header>
<script src="haptics.js"></script>
  <!-- Game Stage -->
  <main class="flex flex-col items-center my-6">
    <div class="flex justify-between w-full max-w-[700px] mb-3 text-sm px-2">
      <span class="text-emerald-400 font-semibold">YOU: <span id="playerScore">0</span></span>
      <span class="text-xs text-zinc-500">[W / S] or [Arrow Keys] or [Touch/Drag]</span>
      <span class="text-sky-400 font-semibold">AI_CORE: <span id="aiScore">0</span></span>
    </div>

    <canvas id="pongCanvas" width="700" height="450" class="bg-zinc-900 border border-zinc-700 rounded-lg max-w-full touch-none"></canvas>
  </main>

  <!-- Footer -->
  <footer class="text-xs text-zinc-600 text-center pb-2">
    Silicon Arcade • First to 7 wins
  </footer>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');
    const playerScoreEl = document.getElementById('playerScore');
    const aiScoreEl = document.getElementById('aiScore');

    // Simple Web Audio API sound generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'square', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Game state
    let playerScore = 0;
    let aiScore = 0;
    const maxScore = 7;
    let gameOver = false;
    let particles = [];

    // Paddle objects
    const paddleWidth = 12;
    const paddleHeight = 80;
    const player = { x: 20, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, vy: 0, speed: 7 };
    const ai = { x: canvas.width - 20 - paddleWidth, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, speed: 4.8 };

    // Ball object
    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 7,
      speed: 6,
      vx: 6,
      vy: 6
    };

    // Keyboard inputs
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    // Touch / Mouse controls
    function setPaddleTouch(clientY) {
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.height / rect.height;
      const relativeY = (clientY - rect.top) * scale;
      player.y = Math.max(0, Math.min(canvas.height - player.height, relativeY - player.height / 2));
    }

    canvas.addEventListener('mousemove', (e) => setPaddleTouch(e.clientY));
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) setPaddleTouch(e.touches[0].clientY);
    });

    function resetBall(winner) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 6;
      ball.vx = winner === 'player' ? -ball.speed : ball.speed;
      ball.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 4 + 2);
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 14; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 3 + 1,
          alpha: 1,
          color
        });
      }
    }

    function update() {
      if (gameOver) return;

      // Player Movement
      if (keys['w'] || keys['W'] || keys['ArrowUp']) player.y -= player.speed;
      if (keys['s'] || keys['S'] || keys['ArrowDown']) player.y += player.speed;
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

      // AI Movement (Predictive tracking)
      const aiCenter = ai.y + ai.height / 2;
      if (aiCenter < ball.y - 12) {
        ai.y += ai.speed;
      } else if (aiCenter > ball.y + 12) {
        ai.y -= ai.speed;
      }
      ai.y = Math.max(0, Math.min(canvas.height - ai.height, ai.y));

      // Ball Movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / Bottom boundary bounce
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.vy = -ball.vy;
        playBeep(260, 'sine', 0.04);
      }

      // Check Player Paddle Collision
      if (
        ball.x - ball.radius <= player.x + player.width &&
        ball.x + ball.radius >= player.x &&
        ball.y >= player.y &&
        ball.y <= player.y + player.height
      ) {
        const offset = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = Math.abs(ball.speed) * Math.cos(offset * 0.7);
        ball.vy = ball.speed * Math.sin(offset * 0.7);
        createExplosion(ball.x, ball.y, '#34d399');
        playBeep(440, 'square');
        triggerHaptic('LIGHT');
      }

      // Check AI Paddle Collision
      if (
        ball.x + ball.radius >= ai.x &&
        ball.x - ball.radius <= ai.x + ai.width &&
        ball.y >= ai.y &&
        ball.y <= ai.y + ai.height
      ) {
        const offset = (ball.y - (ai.y + ai.height / 2)) / (ai.height / 2);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = -Math.abs(ball.speed) * Math.cos(offset * 0.7);
        ball.vy = ball.speed * Math.sin(offset * 0.7);
        createExplosion(ball.x, ball.y, '#38bdf8');
        playBeep(380, 'square');
      }

      // Score Points
      if (ball.x < 0) {
        aiScore++;
        aiScoreEl.textContent = aiScore;
        createExplosion(ball.x + 10, ball.y, '#f87171');
        playBeep(180, 'sawtooth', 0.2);
        triggerHaptic('HEAVY');
        if (aiScore >= maxScore) gameOver = true;
        else resetBall('ai');
      } else if (ball.x > canvas.width) {
        playerScore++;
        playerScoreEl.textContent = playerScore;
        createExplosion(ball.x - 10, ball.y, '#34d399');
        playBeep(620, 'sine', 0.2);
        if (playerScore >= maxScore) gameOver = true;
        else resetBall('player');
      }

      // Update Particles
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });
    }

    function draw() {
      // Background clear
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#27272a';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Player Paddle (Neon Green)
      ctx.fillStyle = '#34d399';
      ctx.shadowColor = '#34d399';
      ctx.shadowBlur = 12;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Draw AI Paddle (Neon Cyan)
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

      // Draw Ball (White core with green glow)
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#34d399';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Clear Shadow for UI text
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(9, 9, 11, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = playerScore >= maxScore ? '#34d399' : '#f87171';
        ctx.font = 'bold 26px "Fira Code", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(playerScore >= maxScore ? 'MISSION ACCOMPLISHED // YOU WIN' : 'SYSTEM OVERRIDE // AI WINS', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#a1a1aa';
        ctx.font = '14px "Fira Code", monospace';
        ctx.fillText('Click anywhere or press Space to play again', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function resetGame() {
      playerScore = 0;
      aiScore = 0;
      playerScoreEl.textContent = '0';
      aiScoreEl.textContent = '0';
      gameOver = false;
      resetBall('player');
    }

    canvas.addEventListener('click', () => { if (gameOver) resetGame(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space' && gameOver) resetGame(); });

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetBall('player');
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
