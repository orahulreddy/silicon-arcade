<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Silicon Arcade // LexiCore</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="haptics.js"></script>
  <style>
    body { font-family: 'Fira Code', monospace; touch-action: manipulation; }
    .slot-box { transition: all 0.2s ease-out; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

  <!-- Header -->
  <header class="max-w-md w-full flex justify-between items-center border-b border-zinc-800 pb-4">
    <a href="/" class="text-xs text-zinc-400 hover:text-teal-400 transition-colors flex items-center gap-1">
      &larr; [RETURN_TO_HUB]
    </a>
    <div class="text-xs text-teal-400 font-bold">SYSTEM // LEXICORE_SPELL_v1.0</div>
  </header>

  <!-- Game Stage -->
  <main class="flex flex-col items-center my-4 w-full max-w-md">
    <!-- HUD -->
    <div class="flex justify-between w-full bg-zinc-900 border border-zinc-800 p-3 rounded-t-lg text-xs">
      <div>
        <span class="text-zinc-500">STREAK:</span>
        <span id="streakDisplay" class="text-teal-400 font-bold text-lg ml-1">0</span>
      </div>
      <div>
        <span class="text-zinc-500">SCORE:</span>
        <span id="scoreDisplay" class="text-emerald-400 font-bold text-lg ml-1">0</span>
      </div>
      <div>
        <span class="text-zinc-500">CLOCK:</span>
        <span id="timerDisplay" class="text-rose-400 font-bold text-lg ml-1">20s</span>
      </div>
    </div>

    <!-- Lexicon Definition Tray -->
    <div class="w-full bg-zinc-900/90 border-x border-zinc-800 p-5 flex flex-col gap-2">
      <div class="flex justify-between text-[11px] text-zinc-500 border-b border-zinc-800 pb-2">
        <span>DATA_NODE: DICTIONARY_PARSE</span>
        <span id="partOfSpeech" class="text-teal-400 uppercase font-semibold">--</span>
      </div>
      <p id="wordClue" class="text-xs text-zinc-300 min-h-[3rem] flex items-center leading-relaxed">
        Decrypting definition packet...
      </p>
    </div>

    <!-- Word Assembly Matrix -->
    <div class="w-full bg-zinc-900 border border-zinc-800 p-4 flex flex-col gap-4">
      <div id="wordSlots" class="flex flex-wrap justify-center gap-1.5 min-h-[48px] items-center">
        <!-- Letter slots injected by JS -->
      </div>

      <!-- Scrambled Letter Bank -->
      <div class="border-t border-zinc-800 pt-3">
        <div class="text-[10px] text-zinc-500 uppercase tracking-widest text-center mb-2">Input Buffer</div>
        <div id="letterRack" class="flex flex-wrap justify-center gap-2 min-h-[48px]">
          <!-- Key buttons injected by JS -->
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="clearBuffer()" class="w-1/3 py-2.5 bg-zinc-950 border border-zinc-800 hover:border-zinc-600 rounded text-xs text-zinc-400 font-semibold active:scale-95">
          [CLEAR]
        </button>
        <button onclick="submitSpelling()" class="w-2/3 py-2.5 bg-teal-950/80 hover:bg-teal-900 border border-teal-500/50 text-teal-300 font-bold rounded text-xs active:scale-95 transition-all">
          TRANSMIT_WORD [ENTER]
        </button>
      </div>

      <div id="feedbackText" class="text-center text-xs text-zinc-500 min-h-[1.2rem]">
        Tap letter nodes to reconstruct the term
      </div>
    </div>
  </main>

  <footer class="text-xs text-zinc-600 text-center pb-2">
    Silicon Arcade • Recompile language memory registers
  </footer>

  <script>
     const wordVault = [
      // --- SCIENCE & NATURE ---
      { word: "HABITAT", pos: "Noun", clue: "The natural home or environment where an animal or plant lives." },
      { word: "SKELETON", pos: "Noun", clue: "The internal framework of bones supporting an animal body." },
      { word: "PREDATOR", pos: "Noun", clue: "An animal that hunts, catches, and eats other animals for food." },
      { word: "NUTRIENT", pos: "Noun", clue: "A substance needed by living things to grow, stay healthy, and survive." },
      { word: "FRICTION", pos: "Noun", clue: "The resistance force created when two touching surfaces slide against each other." },
      { word: "SOLVENT", pos: "Noun", clue: "A liquid substance capable of dissolving other materials." },
      { word: "ECOSYSTEM", pos: "Noun", clue: "A biological community of interacting organisms and their physical environment." },
      { word: "POLLINATE", pos: "Verb", clue: "To carry pollen from one flower to another so seeds can form." },
      { word: "HUMIDITY", pos: "Noun", clue: "The concentration of invisible water vapour present in the air." },
      { word: "ORGANISM", pos: "Noun", clue: "An individual animal, plant, or single-celled life form." },

      // --- GRAMMAR & LITERATURE ---
      { word: "PRONOUN", pos: "Noun", clue: "A word that substitutes for a noun, such as 'he', 'she', or 'it'." },
      { word: "ADJECTIVE", pos: "Noun", clue: "A word that modifies or describes a person, place, or thing." },
      { word: "SYNONYM", pos: "Noun", clue: "A word that has the identical or nearly identical meaning to another." },
      { word: "ANTONYM", pos: "Noun", clue: "A word having a meaning completely opposite to that of another word." },
      { word: "NARRATOR", pos: "Noun", clue: "The person or character who recounts and tells the story." },
      { word: "DIALOGUE", pos: "Noun", clue: "A spoken conversation between two or more characters in a text." },
      { word: "ALLITERATION", pos: "Noun", clue: "The repetition of the same initial letter sound in close words." },
      { word: "SIMILE", pos: "Noun", clue: "Comparing two distinct things using the words 'like' or 'as'." },

      // --- GEOGRAPHY & EARTH SCIENCE ---
      { word: "EQUATOR", pos: "Noun", clue: "An imaginary line circling the Earth halfway between the poles." },
      { word: "GLACIER", pos: "Noun", clue: "A massive, slowly moving river of compressed snow and ice." },
      { word: "VOLCANO", pos: "Noun", clue: "A mountain vent where molten lava, ash, and gases erupt to the surface." },
      { word: "ALTITUDE", pos: "Noun", clue: "The vertical elevation or height of an object above sea level." },
      { word: "PLATEAU", pos: "Noun", clue: "A large, elevated area of relatively flat land rising sharply." },
      { word: "CONTINENT", pos: "Noun", clue: "One of the Earth's primary continuous landmasses (e.g., Asia, Africa)." },
      { word: "MINERAL", pos: "Noun", clue: "A naturally occurring, solid inorganic substance with fixed composition." },

      // --- MATHEMATICS & LOGIC ---
      { word: "FRACTION", pos: "Noun", clue: "A numerical quantity representing a part of an entire whole unit." },
      { word: "DECIMAL", pos: "Noun", clue: "A number expressed in a counting system based on tenths and powers of 10." },
      { word: "PERIMETER", pos: "Noun", clue: "The total distance around the outer boundary edge of a 2D shape." },
      { word: "DIAMETER", pos: "Noun", clue: "A straight line crossing directly through the center of a circle." },
      { word: "POLYGON", pos: "Noun", clue: "A plane 2D geometric shape with at least three straight sides." },
      { word: "PARALLEL", pos: "Adjective", clue: "Lines lying side by side that maintain equal distance and never intersect." },
      { word: "SYMMETRY", pos: "Noun", clue: "The quality of having balanced, identical halves facing each other." },

      // --- CIVICS & HISTORY ---
      { word: "MONARCH", pos: "Noun", clue: "A royal sovereign ruler of a kingdom, such as a King or Queen." },
      { word: "CITIZEN", pos: "Noun", clue: "A recognized, legally belonging member of a sovereign state or nation." },
      { word: "ELECTION", pos: "Noun", clue: "A formal collective voting process to choose a representative leader." },
      { word: "HERITAGE", pos: "Noun", clue: "Valued cultural traditions and historical sites inherited from past generations." },
      { word: "DYNASTY", pos: "Noun", clue: "A succession of rulers belonging to the identical hereditary family." }
    ];

    const partOfSpeechEl = document.getElementById('partOfSpeech');
    const wordClueEl = document.getElementById('wordClue');
    const wordSlotsEl = document.getElementById('wordSlots');
    const letterRackEl = document.getElementById('letterRack');
    const feedbackEl = document.getElementById('feedbackText');
    const scoreEl = document.getElementById('scoreDisplay');
    const streakEl = document.getElementById('streakDisplay');
    const timerEl = document.getElementById('timerDisplay');

    let currentItem = null;
    let selectedLetters = [];
    let score = 0;
    let streak = 0;
    let timeLeft = 20;
    let timerInterval = null;
    let inputLock = false;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'square', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function scramble(str) {
      const arr = str.split('');
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextRound() {
      inputLock = false;
      selectedLetters = [];
      feedbackEl.textContent = "Reconstruct the exact term using the nodes";
      feedbackEl.className = "text-center text-xs text-zinc-500 min-h-[1.2rem]";

      currentItem = wordVault[Math.floor(Math.random() * wordVault.length)];
      partOfSpeechEl.textContent = currentItem.pos;
      wordClueEl.textContent = currentItem.clue;

      renderSlots();
      renderRack();
      startTimer();
    }

    function renderSlots() {
      wordSlotsEl.innerHTML = '';
      for (let i = 0; i < currentItem.word.length; i++) {
        const slot = document.createElement('div');
        const char = selectedLetters[i] || '';
        slot.className = `w-8 h-9 border rounded flex items-center justify-center font-bold text-sm ${
          char ? 'border-teal-400 bg-teal-950/40 text-teal-300' : 'border-zinc-800 bg-zinc-950 text-transparent'
        }`;
        slot.textContent = char || '-';
        wordSlotsEl.appendChild(slot);
      }
    }

    function renderRack() {
      letterRackEl.innerHTML = '';
      const letters = scramble(currentItem.word);
      letters.forEach((l, index) => {
        const btn = document.createElement('button');
        btn.id = `tile-${index}`;
        btn.className = "w-9 h-10 bg-zinc-950 border border-zinc-700 hover:border-teal-400 rounded text-sm font-bold text-zinc-200 active:scale-95 transition-all";
        btn.textContent = l;
        btn.onclick = () => selectLetter(l, btn);
        letterRackEl.appendChild(btn);
      });
    }

    function selectLetter(letter, btn) {
      if (inputLock || selectedLetters.length >= currentItem.word.length) return;
      selectedLetters.push(letter);
      btn.disabled = true;
      btn.classList.add('opacity-20', 'pointer-events-none');
      playBeep(420 + selectedLetters.length * 30, 'sine', 0.04);
      if (typeof triggerHaptic === 'function') triggerHaptic('LIGHT');
      renderSlots();

      if (selectedLetters.length === currentItem.word.length) {
        submitSpelling();
      }
    }

    function clearBuffer() {
      if (inputLock) return;
      selectedLetters = [];
      renderSlots();
      const buttons = letterRackEl.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.disabled = false;
        btn.classList.remove('opacity-20', 'pointer-events-none');
      });
      playBeep(240, 'triangle', 0.05);
    }

    function submitSpelling() {
      if (inputLock) return;
      inputLock = true;
      clearInterval(timerInterval);

      const attempt = selectedLetters.join('');
      if (attempt === currentItem.word) {
        score += 25 + (timeLeft * 2);
        streak += 1;
        scoreEl.textContent = score;
        streakEl.textContent = streak;
        feedbackEl.textContent = "SYNTAX_VERIFIED // MEMORY RESTORED (+25)";
        feedbackEl.className = "text-center text-xs text-teal-400 font-bold min-h-[1.2rem]";
        playBeep(660, 'triangle', 0.15);
        if (typeof triggerHaptic === 'function') triggerHaptic('LIGHT');
        setTimeout(nextRound, 1200);
      } else {
        streak = 0;
        streakEl.textContent = streak;
        feedbackEl.textContent = `PARITY_ERROR // SPELLING: ${currentItem.word}`;
        feedbackEl.className = "text-center text-xs text-rose-400 font-bold min-h-[1.2rem]";
        playBeep(160, 'sawtooth', 0.25);
        if (typeof triggerHaptic === 'function') triggerHaptic('HEAVY');
        setTimeout(nextRound, 1600);
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 20;
      timerEl.textContent = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          inputLock = true;
          streak = 0;
          streakEl.textContent = streak;
          feedbackEl.textContent = `SYSTEM_TIMEOUT // WORD: ${currentItem.word}`;
          feedbackEl.className = "text-center text-xs text-rose-500 font-bold min-h-[1.2rem]";
          playBeep(130, 'sawtooth', 0.3);
          if (typeof triggerHaptic === 'function') triggerHaptic('HEAVY');
          setTimeout(nextRound, 1800);
        }
      }, 1000);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace') clearBuffer();
      if (e.key === 'Enter') submitSpelling();
    });

    nextRound();
  </script>
</body>
</html>
